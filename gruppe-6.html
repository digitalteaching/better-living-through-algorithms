<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Group 6: Better Living Through Algorithms</title>
<style id="main-style">
:root {
  --accent: #44701F; --accent-ink: #385E19; --accent-wash: #E9F1E0; --accent-wash-strong: #BECDB1;
  --paper: #F5F6F2;
  --sheet: #FFFFFF;
  --ink: #1D2330;
  --graphite: #5A6170;
  --rule: #D9DCD3;
  --rule-soft: #E7E9E3;
  --app: #3C4454;
  --art: #CC2F69;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--sans); }
.wrap { max-width: 46rem; margin: 0 auto; padding: 0 16px; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top navigation */
.topnav { position: sticky; top: 0; z-index: 5; background: rgba(245,246,242,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.topnav .wrap { display: flex; align-items: center; gap: 6px; min-height: 54px; }
.topnav .grp { font-family: var(--serif); font-weight: 600; margin-right: 8px; white-space: nowrap; }
.topnav .stepnav { display: flex; gap: 4px; }
.topnav .stepnav a { text-decoration: none; color: var(--graphite); font-size: .9rem; padding: 4px 9px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.topnav .stepnav a:hover { border-color: var(--rule); }
.topnav .stepnav a .tick { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--graphite); margin-right: 6px; vertical-align: 1px; }
.topnav .stepnav a.done .tick { background: var(--accent); border-color: var(--accent); }
.topnav .stepnav a.part .tick { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
.topnav .spacer { flex: 1; }
.btn { font: 600 .95rem var(--sans); border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); }
.btn:hover { border-color: var(--graphite); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { filter: brightness(1.08); border-color: var(--accent); }
@media (max-width: 560px) { .topnav .stepnav .lbl { display: none; } .topnav .grp { display: none; } }

/* header */
header.top { padding: 36px 0 8px; }
.story { font-family: var(--serif); color: var(--graphite); margin: 0 0 14px; font-size: 1.02rem; }
.story cite { font-style: italic; color: var(--ink); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2.1rem, 7vw, 3.1rem); line-height: 1.05; margin: 0 0 12px; letter-spacing: -.01em; }
.range { font-family: var(--serif); font-size: 1.12rem; margin: 0; }
.range .pp { color: var(--graphite); }
.map { display: flex; gap: 3px; margin: 22px 0 6px; height: 30px; }
.map > div { flex: var(--n) 1 0; min-width: 0; background: var(--rule-soft); border-radius: 3px; display: flex; align-items: center; justify-content: center; font: 600 .78rem var(--sans); color: var(--graphite); }
.map > div.is-current { background: var(--accent); color: #fff; }
.map-scale { display: flex; justify-content: space-between; font-size: .78rem; color: var(--graphite); }

/* brief */
.brief { margin: 28px 0 40px; padding: 18px 20px; background: var(--sheet); border-radius: 8px; border-left: 4px solid var(--accent); }
.brief p { margin: 0 0 10px; }
.brief ul { margin: 0; padding-left: 1.15em; }
.brief li { margin: 4px 0; }

/* steps */
.step { margin: 0 0 48px; scroll-margin-top: 70px; }
.step-head { display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
.step-num { font-family: var(--serif); font-size: 2.6rem; line-height: .9; color: var(--accent); font-weight: 600; }
.step-head h2 { font-family: var(--serif); font-size: 1.65rem; margin: 0; font-weight: 600; line-height: 1.15; }
.step-time { margin-left: auto; color: var(--graphite); font-size: .88rem; white-space: nowrap; }
.step-intro { color: var(--graphite); margin: 0 0 22px; }
.task { margin: 0 0 24px; }
.q { display: block; font-weight: 600; margin: 0 0 7px; }
.q .no { color: var(--accent-ink); margin-right: 6px; font-variant-numeric: tabular-nums; }
.q .sub { display: block; font-weight: 400; color: var(--graphite); font-size: .93rem; margin-top: 2px; }
textarea, input[type=text] { width: 100%; font: 1.04rem/1.5 var(--serif); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; resize: vertical; -webkit-appearance: none; appearance: none; }
textarea::placeholder, input::placeholder { color: #9AA0A8; font-family: var(--sans); font-size: .95rem; }
textarea:focus, input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

/* close-reading foci */
.focus { margin: 0 0 30px; padding-left: 16px; border-left: 3px solid var(--accent-wash-strong); }
.focus-head { display: flex; gap: 12px; align-items: center; }
.letter { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 1.05rem var(--serif); }
.focus h3 { margin: 0; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.focus .lines { color: var(--accent-ink); font-size: .9rem; font-variant-numeric: tabular-nums; }
.ask { margin: 12px 0 8px; }
details.hint { margin: 0 0 12px; }
details.hint summary { cursor: pointer; color: var(--accent-ink); font-size: .93rem; width: max-content; }
details.hint p { margin: 6px 0 0; padding: 10px 12px; background: var(--accent-wash); border-radius: 6px; font-size: .95rem; }
.field-label { display: block; font-size: .86rem; color: var(--graphite); margin: 12px 0 5px; }

details.toolbox { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 16px; margin: 0 0 30px; }
details.toolbox summary { cursor: pointer; font-weight: 600; }
.toolbox dl { margin: 12px 0 6px; display: grid; grid-template-columns: minmax(9rem, max-content) 1fr; gap: 6px 16px; font-size: .94rem; }
.toolbox dt { font-family: var(--serif); font-weight: 600; }
.toolbox dd { margin: 0; color: var(--ink); }
.toolbox h4 { margin: 14px 0 6px; font-size: .95rem; }
.toolbox ul { margin: 0; padding-left: 1.1em; font-family: var(--serif); font-size: .98rem; }
@media (max-width: 560px) { .toolbox dl { grid-template-columns: 1fr; } .toolbox dd { margin-bottom: 6px; } }

/* chart */
.chart-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.seg button { font: 600 .92rem var(--sans); border: 0; background: transparent; padding: 8px 12px; cursor: pointer; color: var(--graphite); display: inline-flex; align-items: center; gap: 7px; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed=true] { background: var(--ink); color: #fff; }
.key { display: inline-block; width: 18px; height: 0; border-top: 3px solid var(--app); }
.key-app { border-top-style: dashed; }
.key-art { border-color: var(--art); }
.seg button[aria-pressed=true] .key-app { border-top-color: #fff; }
.link-btn { font: inherit; font-size: .9rem; background: none; border: 0; color: var(--accent-ink); text-decoration: underline; cursor: pointer; padding: 4px; }
.chart-box { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 6px 2px; }
svg.chart { display: block; width: 100%; height: auto; }
svg.chart .g { stroke: var(--rule-soft); stroke-width: 1; }
svg.chart .g0 { stroke: #B8BDB2; stroke-width: 1.2; }
svg.chart .yl, svg.chart .xl { font: 14px var(--sans); fill: var(--graphite); }
svg.chart .ln { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
svg.chart .ln-app { stroke: var(--app); stroke-dasharray: 9 7; }
svg.chart .ln-art { stroke: var(--art); }
svg.chart .mk-app { fill: var(--app); }
svg.chart .mk-art { fill: var(--art); }
svg.chart .hit { fill: transparent; cursor: pointer; }
svg.chart .hit:hover { fill: var(--accent); fill-opacity: .07; }
svg.chart .hit:focus { outline: none; stroke: var(--accent); stroke-width: 2; }
.chart-note { font-size: .9rem; color: var(--graphite); margin: 8px 0 0; }

.stages { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 10px; }
.stages label { position: relative; cursor: pointer; }
.stages input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.stages span { display: inline-block; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 7px 14px; font-size: .95rem; }
.stages input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.stages input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* finish */
.finish { border-top: 2px solid var(--ink); padding: 22px 0 70px; }
.finish p { margin: 0 0 14px; }
.finish .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn-big { font-size: 1.1rem; padding: 14px 24px; }
.kbd { color: var(--graphite); font-size: .88rem; }
.missing { margin: 14px 0 0; font-size: .92rem; color: var(--accent-ink); min-height: 1.2em; }
.status { margin-top: 26px; font-size: .85rem; color: var(--graphite); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }

/* presentation */
.deck { position: fixed; inset: 0; z-index: 20; background: #fff; display: none; flex-direction: column; }
.deck.is-open { display: flex; }
body.deck-open { overflow: hidden; }
.deck-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; font-size: 14px; background: var(--paper); }
.deck-bar .who { font-family: var(--serif); font-weight: 600; margin-right: 6px; }
.deck-bar .count { color: var(--graphite); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: center; }
.deck-bar .spacer { flex: 1; }
.deck-bar .btn { font-size: .85rem; padding: 6px 11px; }
.slides { flex: 1; overflow: auto; }
.slide { display: none; padding: clamp(22px, 4vw, 70px) clamp(18px, 5.5vw, 96px) clamp(28px, 4vw, 60px); font-size: clamp(16px, 1.5vw, 30px); line-height: 1.45; }
.slide.is-active { display: block; }
.slide p { margin: 0 0 .55em; }
.s-meta { color: var(--accent-ink); font-weight: 600; margin: 0 0 .7em !important; font-size: .85em; }
.s-head { font-family: var(--serif); font-size: 3em; line-height: 1.04; margin: 0 0 .45em; font-weight: 600; letter-spacing: -.015em; max-width: 21ch; }
.s-key { font-family: var(--serif); font-style: italic; font-size: 1.4em; line-height: 1.32; margin: 0 0 1.1em; padding: .05em 0 .05em .8em; border-left: .16em solid var(--accent); max-width: 42ch; }
.s-key p { margin: 0; }
.s-label { font-size: .78em; color: var(--graphite); font-weight: 600; margin: 0 0 .35em; }
.s-sum { max-width: 62ch; }
.s-map { margin-top: 1.4em; max-width: 62ch; }
.s-map .map { height: 1.6em; margin: 0 0 .25em; }
.s-map .map > div { font-size: .62em; }
.s-map .map-scale { font-size: .62em; }
.s-title { font-family: var(--serif); font-size: 2.1em; line-height: 1.1; margin: 0 0 .8em; font-weight: 600; }
.s2 { font-size: clamp(15px, 1.2vw, 24px); }
.s-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6em; }
.s-card { border-top: .22em solid var(--accent); padding-top: .7em; }
.s-card h3 { font-family: var(--serif); font-size: 1.3em; line-height: 1.2; margin: 0 0 .15em; font-weight: 600; }
.s-card .s-lines { color: var(--accent-ink); font-size: .85em; margin: 0 0 .8em; }
.s-ev { font-family: var(--serif); font-style: italic; font-size: 1.06em; padding: .5em .7em; background: var(--accent-wash); border-radius: .3em; margin: 0 0 .8em; }
.s-ev p:last-child, .s-an p:last-child { margin-bottom: 0; }
.s3 { font-size: clamp(15px, 1.35vw, 27px); }
.s-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 2.4em; align-items: start; }
.s-legend { display: flex; gap: 1.2em; font-size: .8em; color: var(--graphite); margin: 0 0 .4em; flex-wrap: wrap; }
.s-legend span { display: inline-flex; align-items: center; gap: .45em; }
.s-chart .chart-just { font-size: .88em; margin-top: .6em; }
.s-stage { display: inline-block; background: var(--accent); color: #fff; padding: .2em .7em; border-radius: 999px; font-weight: 600; font-size: .9em; margin: 0 0 .6em; }
.s-q { margin-top: 1.4em; padding: .8em 1em; background: var(--accent-wash); border-radius: .4em; }
.s-q .q-text { font-family: var(--serif); font-size: 1.3em; line-height: 1.3; }
.empty { color: #9AA0A8; font-style: italic; }
@media (max-width: 820px) {
  .s-cards, .s-grid { grid-template-columns: 1fr; }
  .slide, .s2, .s3 { font-size: 16px; }
  .s-head { font-size: 2.3em; }
}

@media print {
  @page { size: A4 landscape; margin: 12mm; }
  body { background: #fff; }
  .topnav, .editor, .deck-bar { display: none !important; }
  .deck { position: static; display: block !important; }
  .slides { overflow: visible; }
  .slide, .s2, .s3 { display: block !important; font-size: 11.5pt; padding: 0; break-after: page; page-break-after: always; }
  .slide:last-child { break-after: auto; page-break-after: auto; }
  .s-head { font-size: 30pt; }
  .s-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .s-grid { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .map > div.is-current, .letter, .s-stage { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .s-ev, .s-q { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .slide { animation: none !important; }
}
body.is-export { background: #fff; }
body.is-export .deck { position: static; display: block; }
body.is-export .slide { display: block; border-bottom: 1px solid var(--rule); animation: none; }
@media (prefers-reduced-motion: no-preference) {
  .slide.is-active { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: .3; } to { opacity: 1; } }
}
</style>
</head>
<body>
<nav class="topnav" aria-label="Steps">
  <div class="wrap">
    <span class="grp" id="nav-grp"></span>
    <div class="stepnav" id="stepnav"></div>
    <span class="spacer"></span>
    <button class="btn btn-accent" type="button" data-action="present">Present</button>
  </div>
</nav>
<main class="editor wrap" id="editor"></main>
<div class="deck" id="deck" role="dialog" aria-modal="true" aria-label="Presentation">
  <div class="deck-bar">
    <span class="who" id="deck-who"></span>
    <button class="btn" type="button" data-action="prev" aria-label="Previous slide">‹ Back</button>
    <span class="count" id="deck-count"></span>
    <button class="btn" type="button" data-action="next" aria-label="Next slide">Next ›</button>
    <span class="spacer"></span>
    <button class="btn" type="button" data-action="fullscreen" id="fs-btn" hidden>Full screen</button>
    <button class="btn" type="button" data-action="print">Print or save as PDF</button>
    <button class="btn" type="button" data-action="download">Download</button>
    <button class="btn btn-accent" type="button" data-action="edit">Edit answers</button>
  </div>
  <div class="slides" id="slides"></div>
</div>
<script>const CONFIG = {"n": 6, "a": 536, "b": 590, "pages": "73–74", "first": "Then one afternoon I got a text.", "last": "… Let’s both try something new.", "art": true, "foci": [{"key": "A", "title": "A message, not an instruction", "lines": "ll. 536–550", "ask": "How is this turning point narrated? Pay attention to the italics, to the narrator’s first assumption (ll. 536–537) and to her question in l. 544.", "hint": "Earlier in the story, whose messages were printed in italics? What does it mean that she cannot tell at once who is writing to her?"}, {"key": "B", "title": "Seeing differently", "lines": "ll. 551–576", "ask": "How has the narrator’s view of her own art – and of the world – changed? Look for echoes of earlier passages (l. 245, l. 445) and at the tense in ll. 572–576.", "hint": "Compare “in its own messy way” (l. 445) with ll. 560–561. Who decides what to paint now (l. 569)?"}, {"key": "C", "title": "The last scene", "lines": "ll. 576–590", "ask": "How does the final scene echo the beginning of the story and the narrator’s first contact with the art community (ll. 34–39, 195–203)? Is the ending open or closed?", "hint": "“Club” sounds like another word the story used many times. Who said “belong” in l. 195 – and who says it now? Also compare “flushed” in l. 20, l. 197 and l. 584."}], "terms": [["turning point", "The moment where the action or a character changes direction."], ["italics", "Can mark emphasis, unspoken thoughts or written messages. Always check which function applies."], ["symbol", "A concrete object that stands for an abstract idea."], ["echo", "A later passage repeats words from an earlier one and invites comparison."], ["rhetorical question", "A question that expects no answer but makes the reader think."], ["tense shift", "A change of tense, e.g. from the past into the present."], ["epiphany", "A sudden moment of insight."], ["circular structure", "The ending returns to the beginning, usually with a difference."], ["open ending", "An ending that leaves central questions for the reader to answer."], ["contrast", "Two things are set against each other to highlight a difference."]], "phrases": ["The narrator’s use of … emphasises / suggests / reveals …", "The quotation “…” (l. 00) shows that …", "By contrasting … with …, the text highlights …", "This creates a(n) ironic / humorous / tense atmosphere because …", "This passage prepares the reader for …"], "sections": [[1, 71], [72, 203], [204, 321], [322, 449], [450, 535], [536, 590]]};</script>
<script>
(function () {
  "use strict";
  var C = CONFIG;
  var KEY = "blta-closereading-group" + C.n + "-v1";
  var ROWS = [2, 1, 0, -1, -2];
  var ROWLABEL = { "2": "very positive", "1": "positive", "0": "mixed", "-1": "negative", "-2": "very negative" };
  var STAGES = ["Exposition", "Rising action", "Turning point", "Falling action", "Resolution"];
  var COLNAMES = ["Start (l. " + C.a + ")", "Middle", "End (l. " + C.b + ")"];
  var FOCUS_KEYS = C.foci.map(function (f) { return f.key; });

  function blank() { return { fields: {}, curve: { app: [null, null, null], art: [null, null, null] } }; }
  function load() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.fields && s.curve && s.curve.app && s.curve.art) return s;
      }
    } catch (e) { /* storage unavailable */ }
    return blank();
  }
  var state = load();
  var storageOK = true;
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        window.localStorage.setItem(KEY, JSON.stringify(state));
        storageOK = true;
        setStatus("Saved on this device.");
      } catch (e) {
        storageOK = false;
        setStatus("Not saved: this browser blocks storage. Keep this tab open until you have presented.");
      }
    }, 250);
  }
  function setStatus(t) { var el = document.getElementById("save-status"); if (el) el.textContent = t; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function val(k) { return (state.fields[k] || "").trim(); }
  function paras(s, emptyText) {
    var t = (s || "").trim();
    if (!t) return '<p class="empty">' + (emptyText || "Not filled in yet") + "</p>";
    return t.split(/\n\s*\n/).map(function (p) { return "<p>" + esc(p).replace(/\n/g, "<br>") + "</p>"; }).join("");
  }

  function storyMap() {
    var segs = C.sections.map(function (s, i) {
      var n = i + 1;
      return '<div style="--n:' + (s[1] - s[0] + 1) + '" class="' + (n === C.n ? "is-current" : "") + '" title="Group ' + n + ": ll. " + s[0] + "–" + s[1] + '">' + n + "</div>";
    }).join("");
    return '<div class="map" aria-hidden="true">' + segs + '</div><div class="map-scale"><span>l. 1</span><span>The whole story, six sections</span><span>l. 590</span></div>';
  }

  /* ---------- chart ---------- */
  function chartSVG(curve, o) {
    var W = 520, H = 286, L = 108, R = 14, T = 12, B = 42;
    var pw = W - L - R, ph = H - T - B, cw = pw / 3, rh = ph / 5;
    function cx(i) { return L + cw * (i + 0.5); }
    function cy(v) { return T + rh * (2 - v + 0.5); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Attitude chart: the narrator\'s attitude towards Abelique' + (o.art ? " and towards drawing" : "") + '">';
    ROWS.forEach(function (v) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + cy(v) + '" y2="' + cy(v) + '" class="' + (v === 0 ? "g0" : "g") + '"/>';
      s += '<text x="' + (L - 10) + '" y="' + (cy(v) + 5) + '" text-anchor="end" class="yl">' + ROWLABEL[String(v)] + "</text>";
    });
    for (var i = 0; i < 3; i++) {
      s += '<line x1="' + cx(i) + '" x2="' + cx(i) + '" y1="' + T + '" y2="' + (T + ph) + '" class="g"/>';
      s += '<text x="' + cx(i) + '" y="' + (H - 12) + '" text-anchor="middle" class="xl">' + COLNAMES[i] + "</text>";
    }
    var series = o.art ? [["app", -7], ["art", 7]] : [["app", 0]];
    series.forEach(function (pair) {
      var k = pair[0], dx = pair[1], pts = curve[k], d = "";
      for (var j = 0; j < 2; j++) {
        if (pts[j] != null && pts[j + 1] != null) d += "M" + (cx(j) + dx) + "," + cy(pts[j]) + "L" + (cx(j + 1) + dx) + "," + cy(pts[j + 1]);
      }
      if (d) s += '<path d="' + d + '" class="ln ln-' + k + '"/>';
      pts.forEach(function (v, j) {
        if (v == null) return;
        var x = cx(j) + dx, y = cy(v);
        s += k === "app"
          ? '<rect x="' + (x - 7) + '" y="' + (y - 7) + '" width="14" height="14" class="mk-app"/>'
          : '<circle cx="' + x + '" cy="' + y + '" r="8" class="mk-art"/>';
      });
    });
    if (o.interactive) {
      for (var c = 0; c < 3; c++) {
        ROWS.forEach(function (v) {
          s += '<rect class="hit" x="' + (L + cw * c) + '" y="' + (T + rh * (2 - v)) + '" width="' + cw + '" height="' + rh + '" data-col="' + c + '" data-val="' + v + '" tabindex="0" role="button" aria-label="' + COLNAMES[c] + ": " + ROWLABEL[String(v)] + '"/>';
        });
      }
    }
    return s + "</svg>";
  }
  var activeSeries = "app";
  function renderChart(focusSel) {
    var box = document.getElementById("chart-box");
    if (!box) return;
    box.innerHTML = chartSVG(state.curve, { interactive: true, art: C.art });
    if (focusSel) { var el = box.querySelector(focusSel); if (el) el.focus(); }
    document.querySelectorAll("[data-series]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-series") === activeSeries));
    });
  }
  function setPoint(col, v) {
    var arr = state.curve[activeSeries];
    arr[col] = arr[col] === v ? null : v;
    save(); renderChart('.hit[data-col="' + col + '"][data-val="' + v + '"]'); updateProgress();
  }

  /* ---------- editor ---------- */
  function field(id, kind, placeholder, rows) {
    var v = esc(state.fields[id] || "");
    if (kind === "input") return '<input type="text" id="f-' + id + '" data-field="' + id + '" placeholder="' + esc(placeholder) + '" value="' + v + '" autocomplete="off">';
    return '<textarea id="f-' + id + '" data-field="' + id + '" rows="' + (rows || 3) + '" placeholder="' + esc(placeholder) + '">' + v + "</textarea>";
  }
  function renderEditor() {
    var h = "";
    h += '<header class="top">';
    h += '<p class="story">Naomi Kritzer, <cite>Better Living Through Algorithms</cite></p>';
    h += "<h1>Group " + C.n + ": lines " + C.a + "–" + C.b + "</h1>";
    h += '<p class="range">From “' + esc(C.first) + "” to “" + esc(C.last) + '” <span class="pp">Textbook pp. ' + C.pages + ".</span></p>";
    h += storyMap();
    h += "</header>";

    h += '<section class="brief" aria-label="How this works">';
    h += "<p>Your group is the class’s expert on one section of the story. Read it closely, work through the three steps and then create your presentation. After all six groups have presented, everyone should understand the whole story: what happens, how it is built and how it is told.</p>";
    h += "<ul>";
    h += "<li>Open your textbook at pp. " + C.pages + ". All line numbers refer to it.</li>";
    h += "<li>Choose one device as your group’s scribe. Answers are saved on this device only, and the presentation is created here.</li>";
    h += "<li>Write in English. Quote exactly and give line numbers: (l. 71) or (ll. 10–11).</li>";
    h += "<li>Time: about 40 minutes. Then present in about 5 minutes, one speaker per slide.</li>";
    h += "</ul></section>";

    // Step 1
    h += '<section class="step" id="step1"><div class="step-head"><span class="step-num">1</span><h2>Get the gist</h2><span class="step-time">about 8 min</span></div>';
    h += '<p class="step-intro">Make sure everyone in the class will know what happens in your section.</p>';
    h += '<div class="task"><label class="q" for="f-headline"><span class="no">1a</span>Give your section a headline.<span class="sub">Eight words at most. It may contain a short quotation.</span></label>' + field("headline", "input", "Your headline") + "</div>";
    h += '<div class="task"><label class="q" for="f-summary"><span class="no">1b</span>Summarise what happens.<span class="sub">Three to four sentences, present tense, your own words, no quotations.</span></label>' + field("summary", "textarea", "Who does what, where and why?", 5) + "</div>";
    h += '<div class="task"><label class="q" for="f-keyline"><span class="no">1c</span>Choose the key line.<span class="sub">The one line that captures your section best. Quote it exactly and add the line number.</span></label>' + field("keyline", "textarea", "“…” (l. 00)", 2) + "</div>";
    h += "</section>";

    // Step 2
    h += '<section class="step" id="step2"><div class="step-head"><span class="step-num">2</span><h2>Read closely</h2><span class="step-time">about 20 min</span></div>';
    h += '<p class="step-intro">Each focus connects evidence from the text with a technique and its effect. Share out the three foci, then check each other’s results.</p>';
    C.foci.forEach(function (f) {
      h += '<div class="focus"><div class="focus-head"><span class="letter" aria-hidden="true">' + f.key + "</span><div><h3>" + f.title + '</h3><span class="lines">' + f.lines + "</span></div></div>";
      h += '<p class="ask">' + f.ask + "</p>";
      h += '<details class="hint"><summary>Need a hint?</summary><p>' + f.hint + "</p></details>";
      h += '<label class="field-label" for="f-' + f.key + '_ev">Evidence: one or two quotations with line numbers</label>' + field(f.key + "_ev", "textarea", "“…” (l. 00)", 2);
      h += '<label class="field-label" for="f-' + f.key + '_an">Analysis: technique and effect</label>' + field(f.key + "_an", "textarea", "The narrator uses … This shows / suggests …", 4);
      h += "</div>";
    });
    h += '<details class="toolbox"><summary>Toolbox: terms and phrases for your analysis</summary><dl>';
    C.terms.forEach(function (t) { h += "<dt>" + esc(t[0]) + "</dt><dd>" + esc(t[1]) + "</dd>"; });
    h += "</dl><h4>Useful phrases</h4><ul>";
    C.phrases.forEach(function (p) { h += "<li>" + esc(p) + "</li>"; });
    h += "</ul></details>";
    h += "</section>";

    // Step 3
    h += '<section class="step" id="step3"><div class="step-head"><span class="step-num">3</span><h2>See the bigger picture</h2><span class="step-time">about 10 min</span></div>';
    h += '<p class="step-intro">Place your section in the whole story. Together, the six charts will show how the narrator develops.</p>';
    h += '<div class="task"><span class="q"><span class="no">3a</span>Plot the narrator’s attitude.';
    h += C.art
      ? '<span class="sub">How does she feel about Abelique, and about drawing, at the start, in the middle and at the end of your section? Choose a line, then tap the grid. Tap a point again to remove it.</span></span>'
      : '<span class="sub">How does she feel about Abelique at the start, in the middle and at the end of your section? Tap the grid to set a point; tap it again to remove it. Drawing does not appear in your section yet.</span></span>';
    h += '<div class="chart-tools"><div class="seg" role="group" aria-label="Line to draw">';
    h += '<button type="button" data-series="app" aria-pressed="true"><span class="key key-app"></span>Abelique</button>';
    if (C.art) h += '<button type="button" data-series="art" aria-pressed="false"><span class="key key-art"></span>Drawing</button>';
    h += '</div><button type="button" class="link-btn" data-action="clear-line">Clear this line</button></div>';
    h += '<div class="chart-box" id="chart-box"></div>';
    h += '<label class="field-label" for="f-curveNote">Justify your chart with one or two line references.</label>' + field("curveNote", "textarea", "Start: … (l. 00). End: … (l. 00).", 2);
    h += "</div>";
    h += '<div class="task"><span class="q" id="stage-q"><span class="no">3b</span>Which stage of the plot is your section, and what is its function?<span class="sub">Choose one stage, then explain in two to three sentences what your section contributes to the story as a whole.</span></span>';
    h += '<div class="stages" role="radiogroup" aria-labelledby="stage-q">';
    STAGES.forEach(function (st) {
      h += '<label><input type="radio" name="stage" value="' + st + '"' + (state.fields.stage === st ? " checked" : "") + "><span>" + st + "</span></label>";
    });
    h += "</div>" + field("func", "textarea", "Our section … It prepares / develops / resolves …", 3) + "</div>";
    h += '<div class="task"><label class="q" for="f-question"><span class="no">3c</span>Ask the class a question.<span class="sub">One question your section raises that has no obvious answer, for our discussion later.</span></label>' + field("question", "textarea", "Is it … ? / Why does … ? / To what extent …?", 2) + "</div>";
    h += "</section>";

    h += '<section class="finish"><p>When you are done, create your presentation. Speak freely: the slides are your notes, not a script.</p>';
    h += '<div class="row"><button class="btn btn-accent btn-big" type="button" data-action="present">Create presentation</button><span class="kbd">or press Ctrl + Enter (⌘ + Enter)</span></div>';
    h += '<p class="missing" id="missing" aria-live="polite"></p>';
    h += '<div class="status"><span id="save-status">' + (state.fields.headline || state.fields.summary ? "Saved on this device." : "Your answers are saved on this device as you type.") + '</span><button type="button" class="link-btn" data-action="reset" id="reset-btn">Delete all answers</button></div>';
    h += "</section>";

    document.getElementById("editor").innerHTML = h;
    renderChart();
  }

  /* ---------- progress ---------- */
  function stepStatus() {
    var s1 = ["headline", "summary", "keyline"].filter(function (k) { return val(k); }).length;
    var s2keys = [];
    FOCUS_KEYS.forEach(function (k) { s2keys.push(k + "_ev", k + "_an"); });
    var s2 = s2keys.filter(function (k) { return val(k); }).length;
    var appPts = state.curve.app.filter(function (v) { return v != null; }).length;
    var s3 = (appPts >= 2 ? 1 : 0) + (state.fields.stage ? 1 : 0) + (val("func") ? 1 : 0) + (val("question") ? 1 : 0);
    return [[s1, 3], [s2, s2keys.length], [s3, 4]];
  }
  function missingList() {
    var m = [];
    if (!val("headline")) m.push("1a"); if (!val("summary")) m.push("1b"); if (!val("keyline")) m.push("1c");
    FOCUS_KEYS.forEach(function (k) { if (!val(k + "_ev") || !val(k + "_an")) m.push("2" + k); });
    if (state.curve.app.filter(function (v) { return v != null; }).length < 2) m.push("3a");
    if (!state.fields.stage || !val("func")) m.push("3b");
    if (!val("question")) m.push("3c");
    return m;
  }
  var NAMES = ["Gist", "Close reading", "Bigger picture"];
  function updateProgress() {
    var st = stepStatus();
    document.getElementById("stepnav").innerHTML = st.map(function (p, i) {
      var cls = p[0] === p[1] ? "done" : (p[0] > 0 ? "part" : "");
      return '<a href="#step' + (i + 1) + '" class="' + cls + '"><span class="tick" aria-hidden="true"></span>' + (i + 1) + '<span class="lbl"> ' + NAMES[i] + "</span></a>";
    }).join("");
  }

  /* ---------- presentation ---------- */
  var slideIndex = 0;
  function slidesHTML() {
    var meta = '<p class="s-meta">Group ' + C.n + ", lines " + C.a + "–" + C.b + " (textbook pp. " + C.pages + ")</p>";
    var h = "";
    h += '<section class="slide s1" aria-label="Slide 1: The gist">' + meta;
    h += '<h2 class="s-head">' + (val("headline") ? esc(val("headline")) : '<span class="empty">Your headline</span>') + "</h2>";
    h += '<blockquote class="s-key">' + paras(state.fields.keyline, "Your key line") + "</blockquote>";
    h += '<div class="s-sum"><p class="s-label">What happens</p>' + paras(state.fields.summary) + "</div>";
    h += '<div class="s-map">' + storyMap() + "</div></section>";

    h += '<section class="slide s2" aria-label="Slide 2: Close reading">' + meta + '<h2 class="s-title">Close reading</h2><div class="s-cards">';
    C.foci.forEach(function (f) {
      h += '<article class="s-card"><h3>' + f.key + ". " + f.title + '</h3><p class="s-lines">' + f.lines + "</p>";
      h += '<div class="s-ev">' + paras(state.fields[f.key + "_ev"], "Evidence") + "</div>";
      h += '<div class="s-an">' + paras(state.fields[f.key + "_an"], "Analysis") + "</div></article>";
    });
    h += "</div></section>";

    h += '<section class="slide s3" aria-label="Slide 3: The bigger picture">' + meta + '<h2 class="s-title">The bigger picture</h2><div class="s-grid">';
    h += '<div class="s-chart"><p class="s-label">The narrator’s attitude in our section</p><div class="s-legend"><span><span class="key key-app"></span>Abelique</span>' + (C.art ? '<span><span class="key key-art"></span>Drawing</span>' : "") + "</div>";
    h += chartSVG(state.curve, { interactive: false, art: C.art });
    h += '<div class="chart-just">' + paras(state.fields.curveNote, "Justification") + "</div></div>";
    h += '<div class="s-func"><p class="s-label">Plot stage</p>' + (state.fields.stage ? '<span class="s-stage">' + esc(state.fields.stage) + "</span>" : '<p class="empty">Not chosen yet</p>') + paras(state.fields.func);
    h += '<div class="s-q"><p class="s-label">For discussion</p><div class="q-text">' + paras(state.fields.question) + "</div></div></div>";
    h += "</div></section>";
    return h;
  }
  function renderDeck() {
    document.getElementById("slides").innerHTML = slidesHTML();
    showSlide(slideIndex);
  }
  function showSlide(i) {
    var all = document.querySelectorAll("#slides .slide");
    slideIndex = Math.max(0, Math.min(all.length - 1, i));
    all.forEach(function (el, j) { el.classList.toggle("is-active", j === slideIndex); });
    document.getElementById("deck-count").textContent = (slideIndex + 1) + " / " + all.length;
    document.getElementById("slides").scrollTop = 0;
  }
  function openDeck() {
    var m = missingList();
    document.getElementById("missing").textContent = m.length ? "Still empty or incomplete: " + m.join(", ") + ". You can present anyway and fill these in later." : "";
    slideIndex = 0; renderDeck();
    document.getElementById("deck").classList.add("is-open");
    document.body.classList.add("deck-open");
    document.querySelector('.deck-bar [data-action="next"]').focus();
  }
  function closeDeck() {
    document.getElementById("deck").classList.remove("is-open");
    document.body.classList.remove("deck-open");
    exitFullscreen();
  }
  function fsEnabled() { return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); }
  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFullscreen() {
    try {
      if (isFullscreen()) { exitFullscreen(); return; }
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) { /* ignore */ }
  }
  function exitFullscreen() {
    try {
      if (!isFullscreen()) return;
      if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) { /* ignore */ }
  }
  function download() {
    var css = document.getElementById("main-style").textContent;
    var html = '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Group ' + C.n + ' presentation</title><style>' + css + '<\/style><\/head><body class="is-export"><div class="deck"><div class="slides">' + slidesHTML() + "<\/div><\/div><\/body><\/html>";
    var blob = new Blob([html], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "group-" + C.n + "-presentation.html";
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* ---------- events ---------- */
  var resetArmed = false, resetTimer = null;
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.matches("[data-field]")) { state.fields[t.getAttribute("data-field")] = t.value; save(); updateProgress(); }
    if (t.name === "stage") { state.fields.stage = t.value; save(); updateProgress(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.name === "stage") { state.fields.stage = e.target.value; save(); updateProgress(); }
  });
  document.addEventListener("click", function (e) {
    var hit = e.target.closest(".hit");
    if (hit) { setPoint(+hit.getAttribute("data-col"), +hit.getAttribute("data-val")); return; }
    var ser = e.target.closest("[data-series]");
    if (ser) { activeSeries = ser.getAttribute("data-series"); renderChart(); return; }
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var a = btn.getAttribute("data-action");
    if (a === "present") openDeck();
    else if (a === "edit") closeDeck();
    else if (a === "next") showSlide(slideIndex + 1);
    else if (a === "prev") showSlide(slideIndex - 1);
    else if (a === "fullscreen") toggleFullscreen();
    else if (a === "print") { renderDeck(); window.print(); }
    else if (a === "download") download();
    else if (a === "clear-line") { state.curve[activeSeries] = [null, null, null]; save(); renderChart(); updateProgress(); }
    else if (a === "reset") {
      if (!resetArmed) {
        resetArmed = true; btn.textContent = "Click again to delete everything";
        resetTimer = setTimeout(function () { resetArmed = false; btn.textContent = "Delete all answers"; }, 4000);
      } else {
        clearTimeout(resetTimer); resetArmed = false;
        state = blank();
        try { window.localStorage.removeItem(KEY); } catch (err) { /* ignore */ }
        renderEditor(); updateProgress(); setStatus("All answers deleted.");
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    var deckOpen = document.getElementById("deck").classList.contains("is-open");
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (!deckOpen) openDeck(); return; }
    if (!deckOpen) {
      var hit = e.target.closest && e.target.closest(".hit");
      if (hit && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setPoint(+hit.getAttribute("data-col"), +hit.getAttribute("data-val")); }
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.target.closest("button"))) { e.preventDefault(); showSlide(slideIndex + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); showSlide(slideIndex - 1); }
    else if (e.key === "Escape" && !isFullscreen()) { closeDeck(); }
  });
  window.addEventListener("beforeprint", renderDeck);

  /* ---------- init ---------- */
  document.getElementById("nav-grp").textContent = "Group " + C.n;
  document.getElementById("deck-who").textContent = "Group " + C.n + ", ll. " + C.a + "–" + C.b;
  if (fsEnabled()) document.getElementById("fs-btn").hidden = false;
  renderEditor();
  updateProgress();
  renderDeck();
})();
</script>
</body>
</html>
